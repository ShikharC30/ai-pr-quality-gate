name: "AI SDLC Quality Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  ai-code-review:
    if: github.event_name == 'pull_request' || (github.event.issue.pull_request && contains(github.event.comment.body, 'bot ignore-and-pass'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - name: Resolve Branch & Commit SHA
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('ref', context.payload.pull_request.head.ref);
              core.setOutput('sha', context.payload.pull_request.head.sha);
              core.setOutput('pr_number', context.payload.pull_request.number);
            } else {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              core.setOutput('ref', pr.data.head.ref);
              core.setOutput('sha', pr.data.head.sha);
              core.setOutput('pr_number', context.issue.number);
            }

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests

      - name: Check for User Override Command
        id: override_check
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr_info.outputs.pr_number }}');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const hasOverride = comments.data.some(c => c.body.includes('bot ignore-and-pass'));
            core.setOutput('is_overridden', hasOverride ? 'true' : 'false');

      - name: Run AI Quality Reviewer
        if: steps.override_check.outputs.is_overridden != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/ai_pr_gate.py

      - name: Sync Quality Gate Status & PR Decorations
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.pr_info.outputs.pr_number }}');
            const commitSha = '${{ steps.pr_info.outputs.sha }}';
            const isOverridden = '${{ steps.override_check.outputs.is_overridden }}' === 'true';

            // CASE 1: Manual Override
            if (isOverridden) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '⚡ **Quality Gate Overridden:** Reviewer bypassed checks with `bot ignore-and-pass`. PR is unlocked.'
              });

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: '🔴 merge-blocked'
                });
              } catch(e) {}

              await github.rest.issues.addLabels({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['🟢 override-passed']
              });

              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: commitSha,
                state: 'success',
                context: 'AI SDLC Quality Gate Enforcement',
                description: 'Quality Gate manually overridden by reviewer'
              });
              return;
            }

            // CASE 2: Normal AI Review Run
            if (fs.existsSync('pr_review.md')) {
              const body = fs.readFileSync('pr_review.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

            let blockMerge = false;
            if (fs.existsSync('verdict.json')) {
              const verdict = JSON.parse(fs.readFileSync('verdict.json', 'utf8'));
              blockMerge = verdict.block_merge;
            }

            if (blockMerge) {
              await github.rest.issues.addLabels({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['🔴 merge-blocked']
              });

              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: commitSha,
                state: 'failure',
                context: 'AI SDLC Quality Gate Enforcement',
                description: 'Blocked: Critical flaws or contract violations detected'
              });
            } else {
              await github.rest.issues.addLabels({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['🟢 gate-passed']
              });

              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: commitSha,
                state: 'success',
                context: 'AI SDLC Quality Gate Enforcement',
                description: 'Approved: Clean code & architectural compliance'
              });
            }
