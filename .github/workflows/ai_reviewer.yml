name: "AI SDLC Quality Gate"

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  # ==========================================
  # JOB 1: Review, Contract Check & Merge Block
  # ==========================================
  ai-code-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests

      - name: Run AI Quality Reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/ai_pr_gate.py

      - name: Post Review Comment & Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Post Review
            if (fs.existsSync('pr_review.md')) {
              const body = fs.readFileSync('pr_review.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

            // 2. Add Label
            if (fs.existsSync('verdict.json')) {
              const verdict = JSON.parse(fs.readFileSync('verdict.json', 'utf8'));
              const label = verdict.block_merge ? '🔴 merge-blocked' : '🟢 gate-passed';
              try {
                await github.rest.issues.addLabels({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: [label]
                });
              } catch (e) { console.log("Label note:", e.message); }
            }

      - name: Enforce Merge Gate
        run: |
          python -c "
          import json, sys
          with open('verdict.json') as f:
              data = json.load(f)
          if data.get('block_merge'):
              print('🚨 QUALITY GATE FAILED: PR contains critical security risks or event contract violations.')
              sys.exit(1)
          else:
              print('✅ QUALITY GATE PASSED: PR is safe to merge.')
          "

  # ==========================================
  # JOB 2: Human-Approved Test Case Push
  # ==========================================
  apply-tests:
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'bot apply-tests')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Get PR Branch Details
        id: pr_data
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('branch', pr.data.head.ref);

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_data.outputs.branch }}

      - name: Extract Tests from Bot Comment
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            let testCode = '';
            for (let i = comments.data.length - 1; i >= 0; i--) {
              const comment = comments.data[i];
              if (comment.body.includes('STAGE 3: AUTOMATED UNIT TESTS')) {
                const match = comment.body.match(/```python([\s\S]*?)```/);
                if (match && match[1]) {
                  testCode = match[1].trim();
                  break;
                }
              }
            }

            if (!testCode) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '⚠️ **Bot Alert:** Could not find generated test cases to apply.'
              });
              process.exit(1);
            }

            const fs = require('fs');
            if (!fs.existsSync('tests')) {
              fs.mkdirSync('tests');
            }
            fs.writeFileSync('tests/test_ai_generated.py', '# Auto-committed via developer approval\n\n' + testCode + '\n');

      - name: Commit & Push Tests to Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/test_ai_generated.py
          git commit -m "test(ai): apply unit tests via developer approval [skip ci]"
          git push

      - name: Acknowledge in PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Tests Approved & Applied!** Unit tests have been committed to `tests/test_ai_generated.py` on your branch.'
            });
