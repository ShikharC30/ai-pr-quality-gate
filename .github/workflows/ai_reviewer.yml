name: "AI SDLC Quality Gate"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests

      - name: Run AI Quality Reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/ai_pr_gate.py

      - name: Post Review Comment & Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Post Review
            if (fs.existsSync('pr_review.md')) {
              const body = fs.readFileSync('pr_review.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

            // 2. Add Label
            if (fs.existsSync('verdict.json')) {
              const verdict = JSON.parse(fs.readFileSync('verdict.json', 'utf8'));
              const label = verdict.block_merge ? '🔴 merge-blocked' : '🟢 gate-passed';
              try {
                await github.rest.issues.addLabels({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: [label]
                });
              } catch (e) { console.log("Label note:", e.message); }
            }

      - name: Enforce Merge Gate
        run: |
          python -c "
          import json, sys
          with open('verdict.json') as f:
              data = json.load(f)
          if data.get('block_merge'):
              print('🚨 QUALITY GATE FAILED: PR contains critical security risks or event contract violations.')
              sys.exit(1)
          else:
              print('✅ QUALITY GATE PASSED: PR is safe to merge.')
          "
